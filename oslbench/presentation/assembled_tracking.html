<!doctype html><meta charset="utf-8"><title>OSL two-joint comparison</title>
<style>body{font:16px system-ui;background:#101c29;color:#eee;margin:24px}.toolbar{position:sticky;top:0;background:#101c29;padding:14px;z-index:2;display:flex;gap:15px;flex-wrap:wrap}button,select{font:inherit;padding:8px;background:#243b50;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#192a3d;border-radius:8px;padding:18px;min-width:0}.card[hidden]{display:none}canvas{width:100%;height:300px}pre{white-space:pre-wrap}h2{font-size:18px}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style>
<h1>Assembled OSL: hardware and simulation</h1>
<p>Hardware angles are observations. Torques, belt deformation and PID variables below are SIMULATED. Comparison uses original source times; no lag correction is removed.</p>
<div class="toolbar"><button id="pause">Pause display</button><label>Joint <select id="joint"><option value="both">Both</option><option>knee</option><option>ankle</option></select></label>
<label>Graphs <select id="group"><option>Comparison</option><option>Torques</option><option>Current</option><option>Belt</option><option>PID</option><option>Motion</option></select></label>
<label>Window <select id="window"><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="0">All retained</option></select></label>
<button id="stop">Stop laptop run and save</button></div>
<p id="status"></p><pre id="metrics"></pre><p id="output"></p><p id="assumptions"></p><div id="plots" class="grid"></div>
<script>
const $=id=>document.getElementById(id), colors=['#ffac4c','#53d5af','#7cbcff'];let paused=false,latest=null,busy=false;
const groups={Comparison:[['Angles','degrees',['hardware_angle_deg','sim_angle_deg','target_deg']],['Simulation − hardware','degrees',['difference_deg']],['Hardware target error','degrees',['hardware_tracking_error_deg']],['Simulation target error','degrees',['sim_tracking_error_deg']]],
Torques:[['Joint drive torque','Nm',['joint_drive_torque_Nm']],['Actuator electromagnetic torque','Nm',['actuator_torque_Nm']],['Actuator-side belt torque','Nm',['belt_actuator_torque_Nm']],['Actuator friction','Nm',['friction_torque_Nm']]],
Current:[['Requested current','A',['current_requested_A']],['Applied current','A',['current_applied_A']]],
Belt:[['Belt deflection','rad',['belt_deflection_rad']],['Belt stiffness','Nm/rad',['belt_stiffness_Nm_per_rad']],['Belt energy','J',['belt_energy_J']]],
PID:[['P current','A',['pid_p_A']],['I current','A',['pid_i_A']],['D current','A',['pid_d_A']]],
Motion:[['Simulated angle','degrees',['sim_angle_deg']],['Joint velocity','rad/s',['joint_velocity_rad_s']],['Actuator velocity','rad/s',['actuator_velocity_rad_s']]]};
const cards=[];for(const joint of ['knee','ankle'])for(const [group,plots] of Object.entries(groups))for(const [title,unit,keys] of plots){
const div=document.createElement('div');div.className='card';div.innerHTML='<h2></h2><p></p><canvas></canvas>';div.querySelector('h2').textContent=joint+' — '+title;
const legend=div.querySelector('p');keys.forEach((k,i)=>{const span=document.createElement('span');span.style.color=colors[i];span.textContent=(i?' · ':'')+k.replaceAll('_',' ');legend.append(span)});
$('plots').append(div);cards.push({joint,group,keys,unit,div,canvas:div.querySelector('canvas')});}
function draw(card,rows){let c=card.canvas,x=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=300*devicePixelRatio;let W=c.width,H=c.height,s=devicePixelRatio;
let window=+$('window').value,end=rows.length?rows.at(-1).source_time_s:0;rows=rows.filter(r=>!window||r.source_time_s>=end-window);
let vals=rows.flatMap(r=>card.keys.map(k=>r[k])).filter(Number.isFinite);x.clearRect(0,0,W,H);if(!vals.length)return;
let a=rows[0].source_time_s,b=rows.at(-1).source_time_s,lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*.1||1;lo-=pad;hi+=pad;
let L=65*s,R=20*s,T=15*s,B=55*s; x.font=12*s+'px system-ui';x.strokeStyle='#385066';x.fillStyle='#cbd5df';
for(let i=0;i<5;i++){let yy=T+i*(H-T-B)/4,xx=L+i*(W-L-R)/4;x.beginPath();x.moveTo(L,yy);x.lineTo(W-R,yy);x.stroke();x.fillText((hi-i*(hi-lo)/4).toFixed(2),3*s,yy+4*s);x.fillText((a+i*(b-a)/4).toFixed(2),xx-12*s,H-B+20*s)}
x.fillText('Source time (s)',W/2-45*s,H-8*s);x.save();x.translate(14*s,H/2);x.rotate(-Math.PI/2);x.fillText(card.unit,-20*s,0);x.restore();
card.keys.forEach((k,i)=>{x.strokeStyle=colors[i];x.lineWidth=1.8*s;x.beginPath();let pen=false;for(let r of rows){if(!Number.isFinite(r[k])){pen=false;continue;}let xx=L+(r.source_time_s-a)/(b-a||1)*(W-L-R),yy=T+(hi-r[k])/(hi-lo)*(H-T-B);if(pen)x.lineTo(xx,yy);else x.moveTo(xx,yy);pen=true;}x.stroke()});}
function render(){if(!latest||paused)return;$('status').textContent=latest.source+' | '+latest.status;$('metrics').textContent=JSON.stringify(latest.metrics,null,2);$('output').textContent='Saved to: '+latest.output;$('assumptions').textContent=latest.assumptions;
for(let c of cards){c.div.hidden=c.group!==$('group').value||($('joint').value!=='both'&&c.joint!==$('joint').value);if(!c.div.hidden)draw(c,(c.group==='Comparison'?latest.comparison:latest.telemetry)[c.joint])}}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume display':'Pause display';render()};$('stop').onclick=()=>fetch('/key?k=stop-recording');for(let id of ['joint','group','window'])$(id).onchange=render;
setInterval(async()=>{if(busy)return;busy=true;try{const response=await fetch('/data');latest=await response.json();render()}catch(e){$('status').textContent='Connection closed; displayed data retained'}finally{busy=false}},200);
</script>
